name: Backyamon
options:
  bundleIdPrefix: com.backyamon
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.0.0"

targets:
  Backyamon:
    type: application
    platform: iOS
    sources:
      - path: Backyamon
    dependencies:
      - package: SocketIO
    scheme:
      testTargets:
        - SampleTests
        - RiddimTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backyamon.app
        PRODUCT_NAME: Backyamon
        INFOPLIST_FILE: Backyamon/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Backyamon/Info.plist
      properties:
        CFBundleName: Backyamon
        CFBundleDisplayName: Backyamon
        CFBundleIdentifier: com.backyamon.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: "Record your own sounds and samples to use in the game."

  SampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SampleTests
    dependencies:
      - target: Backyamon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backyamon.SampleTests
        GENERATE_INFOPLIST_FILE: YES

  RiddimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RiddimTests
    dependencies:
      - target: Backyamon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backyamon.RiddimTests
        GENERATE_INFOPLIST_FILE: YES
