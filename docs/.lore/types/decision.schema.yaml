name: decision
dir: decisions
heading: Decisions Log
id: { strategy: sequential, pad: 4 }
body: sections
frontmatter:
  - { name: title, type: string, required: true }
  - { name: date, type: date, required: true }
  - { name: category, type: string }
sections:
  - Why this choice
  - Options considered
  - Tradeoffs
index:
  - { header: "#", source: id }
  - { header: Date, source: date, format: date }
  - { header: Decision, source: title, link: true }
  - { header: Category, source: category }
prompt: |
  You are writing an architectural decision record (ADR). Given a title, produce the markdown body only (no frontmatter).

  Structure:
  - ## Why this choice — the motivation; what problem this solves.
  - ## Options considered — alternatives that were evaluated.
  - ## Tradeoffs — what you gain and what you give up.

  Be specific. Name the actual tools or patterns. No filler.
